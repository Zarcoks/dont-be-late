<form class="d-flex gap-2 mt-2 align-items-center"
      hx-post="{% url 'edit_event' event.id %}"
      hx-target="#event-item-{{ event.id }}"
      hx-swap="innerHTML">
    {% csrf_token %}
    {{ form.location }}
    <button class="btn btn-primary btn-sm" type="submit">Save</button>
    <button class="btn btn-outline-secondary btn-sm" type="button"
            hx-get="{% url 'cancel_edit_event' event.id %}"
            hx-target="#event-form-container-{{ event.id }}"
            hx-swap="innerHTML">
        Cancel
    </button>
</form>
