[project]
name = "dont-be-late"
version = "0.1.0"
description = "Scrap the web to ancipate delays on transports."
readme = "README.md"
authors = [
    { name = "Victor Jost", email = "victor.jost@telecom-sudparis.eu" },
    { name = "Deraina Adriambala", email = "deraina-ny-avo.adriambala@telecom-sudparis.eu" },
    { name = "Laabid El Bagari Basma", email = "basma.laabid-el-bagari@telecom-sudparis.eu" }
]
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=6.1.1",
    "ical>=14.3.0",
    "icalendar>=7.3.0",
    "recurring-ical-events>=3.8.2",
    "requests>=2.34.2",
]
