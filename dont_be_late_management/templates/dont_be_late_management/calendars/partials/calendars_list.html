<div id="calendar_list" class="card mb-4" hx-target="#calendar_list" hx-swap="outerHTML">
    <div class="card-header fw-semibold">
        Calendars
    </div>

    <ul class="list-group list-group-flush">
        {% for calendar in calendars %}
            <li class="list-group-item">
                <div>{{ calendar.name }}</div>
            </li>
        {% empty %}
            <li class="list-group-item text-body-secondary fst-italic">No calendar yet</li>
        {% endfor %}
    </ul>

    <div class="card-body">
        <button class="btn btn-outline-primary btn-sm w-100" type="button"
                hx-get="{% url 'new_calendars' %}" hx-target="this" hx-swap="outerHTML">
            + Add a calendar
        </button>
    </div>
</div>
